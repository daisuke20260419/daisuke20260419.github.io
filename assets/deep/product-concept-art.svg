<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">VERIONの開発中画面で使う一般化されたコンセプトアート</title>
  <desc id="desc">特定の作品や人物を表さない黒と金の抽象図形</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="76%">
      <stop offset="0" stop-color="#26394c"/>
      <stop offset=".46" stop-color="#131820"/>
      <stop offset="1" stop-color="#07080b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f3d594"/>
      <stop offset=".48" stop-color="#b98a42"/>
      <stop offset="1" stop-color="#5f4220"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="13"/></filter>
