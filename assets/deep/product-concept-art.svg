  <path d="M520 620 800 190l280 430-280-86Z" fill="url(#gold)" fill-opacity=".15" stroke="#d9b56e" stroke-opacity=".62" stroke-width="3"/>
  <path d="m656 541 144-219 144 219-144-44Z" fill="none" stroke="#f1d696" stroke-opacity=".6" stroke-width="3"/>
  <circle cx="800" cy="438" r="24" fill="#e7c984" filter="url(#glow)" opacity=".7"/>
  <circle cx="800" cy="438" r="7" fill="#fff1c5"/>
  <path d="M260 180h260M1080 180h260M260 720h260M1080 720h260" stroke="#d7ae66" stroke-opacity=".26" stroke-width="2"/>
  <text x="800" y="770" text-anchor="middle" fill="#d7ae66" font-family="Helvetica,Arial,sans-serif" font-size="28" letter-spacing="10">VERION CONCEPT</text>
  <text x="800" y="812" text-anchor="middle" fill="#8f9299" font-family="Helvetica,Arial,sans-serif" font-size="20" letter-spacing="4">DEVELOPMENT MOCK · NO LICENSED IP SHOWN</text>
